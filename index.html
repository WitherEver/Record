<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>赛博史记 · 图库 | 基于 GitHub Pages 的图片浏览站</title>
  <meta name="description" content="为 GitHub Record 仓库中留档的图片提供更方便的浏览界面，可筛选、搜索，还有河豚爆炸。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./hetun.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./hetun.png">
  <link rel="stylesheet" href="./style.css">
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="赛博史记">
  <meta property="og:title" content="赛博史记 · 图库">
  <meta property="og:description" content="为 GitHub Record 仓库中留档的图片提供更方便的浏览界面，可筛选、搜索，还有河豚爆炸。">
  <meta property="og:url" content="https://www.witherever.com/">
  <meta property="og:image" content="https://www.witherever.com/hetun.png">
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "赛博史记 · 图库",
  "url": "https://www.witherever.com/"
}
</script>
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1 id="site-title">赛博史记</h1>
        </div>
        <div class="topbar-actions">
          <div class="searchbox">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
            <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off"
              spellcheck="false">
          </div>
          <button id="lang-btn" class="icon-btn lang-btn" data-i18n-title="lang" data-i18n-aria="lang">EN</button>
          <button id="theme-btn" class="icon-btn" title="切换主题" aria-label="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" />
              <path
                d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
            </svg>
          </button>
        </div>
      </div>
      <nav id="chips" class="chips" aria-label="筛选"></nav>
    </header>

    <main>
      <div id="grid" class="grid" role="list"></div>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
      <div id="empty" class="empty" hidden>
        <p data-i18n="emptyTitle"></p>
        <p class="muted small" data-i18n="emptyHint"></p>
      </div>
      <div id="loading" class="loading muted" hidden data-i18n="loading"></div>
    </main>

    <footer class="footer muted small">
      <span id="stats">—</span>
      <div id="build-time" class="muted small" style="margin-top: 32px;"></div>
      <div id="footerA" class="muted small" style="margin-top: 4px;"></div>
      <a href="https://www.bilibili.com/video/BV1GJ411x7h7" target="_blank" rel="noopener" class="muted small"
        style="text-decoration: none; border-bottom: 1px dashed var(--muted);">
        <div id="footerB" class="muted small" style="margin-top: 64px;"></div>
        <div id="footerC" class="muted small" style="margin-top: 4px;"></div>
      </a>
    </footer>
  </div>

  <button id="menu-btn" class="menu-btn" data-i18n-title="menu" data-i18n-aria="menu" aria-haspopup="true"
    aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="17" x2="20" y2="17" />
    </svg>
  </button>
  <nav id="menu" class="menu" aria-label="menu" data-i18n-aria="menu">
    <a id="menu-repo" class="menu-item" href="https://github.com/WitherEver/Record" target="_blank" rel="noopener"
      data-i18n="menuRepo"></a>
    <a id="menu-apply" class="menu-item" href="https://apply.witherever.com" target="_blank" rel="noopener"
      data-i18n="menuApply"></a>
    <button id="menu-about" class="menu-item" type="button" data-i18n="menuAbout"></button>

    <div class="menu-divider" aria-hidden="true"></div>

    <div class="menu-switch-item" id="scrollbar-switch-row">
      <span class="menu-switch-label" data-i18n="menuScrollbar"></span>
      <button id="scrollbar-switch" class="puffer-switch" type="button" role="switch" aria-checked="false"
        aria-labelledby="scrollbar-switch-row" data-i18n-aria="menuScrollbar">
        <span class="puffer-switch-thumb" aria-hidden="true"></span>
      </button>
    </div>
  </nav>

  <!---------------------------------------------------------------------------------------------------------弹窗--------------->
  <div id="about-modal" class="modal" role="dialog" aria-modal="true" aria-label="menuAbout" data-i18n-aria="menuAbout">
    <div class="modal-panel">
      <button id="log-btn" class="icon-btn" type="button" data-i18n-title="logsTitle" data-i18n-aria="logsTitle" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h11l3 3v13H5z" />
          <line x1="8" y1="10" x2="16" y2="10" />
          <line x1="8" y1="14" x2="16" y2="14" />
        </svg>
      </button>
      <button id="about-close" class="modal-close icon-btn" data-i18n-title="close" data-i18n-aria="close">✕</button>
      <h2 class="about-title" data-i18n="aboutTitle"></h2>
      <p class="about-q" data-i18n="aboutQ1"></p>
      <p class="about-a" data-i18n="aboutA1"></p>
      <p class="about-q" data-i18n="aboutQ2"></p>
      <p class="about-a" data-i18n="aboutA2"></p>
      <p class="about-q" data-i18n="aboutQ3"></p>
      <p class="about-a" data-i18n="aboutA3"></p>
      <p class="about-highlight" data-i18n="aboutA3b"></p>
    </div>
  </div>

  <div id="log-modal" class="modal" role="dialog" aria-modal="true" aria-label="logs" data-i18n-aria="logsTitle">
    <div class="modal-panel log-panel">
      <button id="log-close" class="modal-close icon-btn" data-i18n-title="close" data-i18n-aria="close">✕</button>
      <div id="log-body" class="log-body"></div>
    </div>
  </div>

  <!-----------------------------------------------------------------------------------------------原图查看器---------------------->
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="ImageViewing">
    <div class="viewer-top">
      <div class="viewer-info">
        <div id="viewer-name" class="viewer-name"></div>
        <div id="viewer-meta" class="viewer-meta muted small"></div>
      </div>
      <div class="viewer-tools">
        <button id="v-zoom-in" class="icon-btn" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6v12M6 12h12" />
          </svg>
        </button>
        <button id="v-zoom-out" class="icon-btn" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 12h12" />
          </svg>
        </button>
        <button id="v-zoom-reset" class="icon-btn" data-i18n-title="zoomReset" data-i18n-aria="zoomReset">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 7L4 12l5 5M4 12h10a4 4 0 0 1 4 4v3" />
          </svg>
        </button>
        <button id="v-close" class="icon-btn" data-i18n-title="close" data-i18n-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="8" x2="16" y2="16" />
            <line x1="16" y1="8" x2="8" y2="16" />
          </svg>
        </button>
      </div>
    </div>

    <button id="v-prev" class="icon-btn v-prev" data-i18n-title="prev" data-i18n-aria="prev" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <button id="v-next" class="icon-btn v-next" data-i18n-title="next" data-i18n-aria="next" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>

    <div id="v-stage" class="v-stage">
      <img id="v-img" alt="" draggable="false">
      <div id="v-loading" class="v-loading muted">
        <img src="./hetun.png" alt="" class="spin">
        <span data-i18n="loading"></span>
      </div>
      <div id="v-error" class="v-error">
        <span id="v-error-text">无网络连接</span>
        <button id="v-retry" class="retry-btn" type="button" data-i18n="retry"></button>
      </div>
    </div>
    <div id="v-counter" class="v-counter muted small"></div>
  </div>

  <noscript>
    <p style="padding:2em;text-align:center">此页面需要启用 JavaScript 才能浏览。</p>
  </noscript>

  <script src="./data/index.js"></script>
  <script src="./lang.js"></script>
  <script src="./logs.js"></script>
  <script src="./app.js"></script>
</body>

</html>
